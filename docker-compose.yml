services:
  veilleur-cve:
    build: .
    image: veilleur-cve:latest
    container_name: veilleur-cve
    restart: unless-stopped
    env_file: .env
    ports:
      # WEB_BIND=127.0.0.1 : interface accessible seulement depuis le serveur (reverse proxy)
      # WEB_BIND=0.0.0.0   : accessible depuis tout le réseau
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - data:/data

  # Traducteur anglais -> français installé en local (activé par COMPOSE_PROFILES=traduction
  # dans .env). Au premier démarrage il télécharge ses modèles (quelques minutes).
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: veilleur-cve-traduction
    restart: unless-stopped
    profiles: ["traduction"]
    environment:
      LT_LOAD_ONLY: "en,fr"
    volumes:
      - lt-models:/home/libretranslate/.local

volumes:
  data:
  lt-models:
